components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 200
        external_ref:
          type: string
          default: ''
          maxLength: 200
        asset_type:
          type: string
          format: uuid
          nullable: true
        parent:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    AssetAttribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
          nullable: true
        asset:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        value_type:
          $ref: '#/components/schemas/AssetAttributeValueTypeEnum'
        unit:
          type: integer
          nullable: true
        description:
          type: string
        storage_datapoint:
          type: boolean
        history_enabled:
          type: boolean
        history_policy_override:
          nullable: true
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset
      - code
      - created_at
      - id
      - name
    AssetAttributeValueTypeEnum:
      enum:
      - string
      - boolean
      - number
      - json
      type: string
      description: |-
        * `string` - String
        * `boolean` - Boolean
        * `number` - Number
        * `json` - Json
    AssetType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/AssetTypeKindEnum'
        description:
          type: string
        schema: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
